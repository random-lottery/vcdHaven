<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户仪表板 - VCDHaven</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navigation Bar -->
    <nav class="w-full bg-gray-800 text-white shadow-lg sticky top-0 z-50 font-sans">
        <div class="max-w-7xl mx-auto flex items-center justify-between px-6 h-16">
            <div class="text-2xl font-bold tracking-wider text-pink-300">vcdHaven</div>
            <ul class="flex space-x-6 m-0 p-0">
                <li class="inline-block">
                    <a href="index.html" class="text-white no-underline text-base px-4 py-2 rounded transition-colors duration-200 hover:bg-pink-300 hover:text-gray-800">
                        <i class="fa fa-home mr-2"></i>首页
                    </a>
                </li>
                <li class="inline-block">
                    <a href="videopage.html" class="text-white no-underline text-base px-4 py-2 rounded transition-colors duration-200 hover:bg-pink-300 hover:text-gray-800">
                        <i class="fa fa-play-circle mr-2"></i>播放视频
                    </a>
                </li>
                <li class="inline-block">
                    <a href="management.html" class="text-white no-underline text-base px-4 py-2 rounded transition-colors duration-200 hover:bg-pink-300 hover:text-gray-800">
                        <i class="fa fa-th-list mr-2"></i>管理视频
                    </a>
                </li>
                <li class="inline-block">
                    <a href="dashboard.html" class="text-white no-underline text-base px-4 py-2 rounded transition-colors duration-200 hover:bg-pink-300 hover:text-gray-800 bg-pink-300 text-gray-800">
                        <i class="fa fa-user-circle mr-2"></i>仪表板
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-6xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-lg p-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-6">
                <i class="fa fa-user-circle mr-2"></i>用户仪表板
            </h1>

            <!-- User Info Section -->
            <div id="user-info-section" class="mb-8">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">用户信息</h2>
                <div class="bg-gray-50 rounded-lg p-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                            <p id="display-username" class="text-gray-900 font-medium">-</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
                            <p id="display-email" class="text-gray-900 font-medium">-</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">手机号</label>
                            <p id="display-phone" class="text-gray-900 font-medium">-</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">状态</label>
                            <p id="display-status" class="text-gray-900 font-medium">-</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">角色</label>
                            <p id="display-roles" class="text-gray-900 font-medium">-</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">最后登录</label>
                            <p id="display-last-login" class="text-gray-900 font-medium">-</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Profile Edit Section -->
            <div id="profile-edit-section" class="mb-8">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">编辑个人资料</h2>
                <form id="profile-form" class="bg-gray-50 rounded-lg p-6 space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">名字</label>
                            <input type="text" id="profile-first-name" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">姓氏</label>
                            <input type="text" id="profile-last-name" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">手机号</label>
                            <input type="tel" id="profile-phone" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">语言</label>
                            <select id="profile-language" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="en-US">English (US)</option>
                                <option value="zh-CN">中文 (简体)</option>
                                <option value="zh-TW">中文 (繁體)</option>
                                <option value="ja-JP">日本語</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">头像 URL</label>
                            <input type="url" id="profile-avatar" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                    <div id="profile-error" class="text-red-500 text-sm hidden"></div>
                    <div id="profile-success" class="text-green-500 text-sm hidden"></div>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-md transition duration-150 ease-in-out">
                        <i class="fa fa-save mr-2"></i>保存更改
                    </button>
                </form>
            </div>

            <!-- Address Section -->
            <div id="address-section" class="mb-8">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">联系地址</h2>
                <form id="address-form" class="bg-gray-50 rounded-lg p-6 space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">街道地址</label>
                            <input type="text" id="address-street" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">城市</label>
                            <input type="text" id="address-city" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">州/省</label>
                            <input type="text" id="address-state" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">邮政编码</label>
                            <input type="text" id="address-zip" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">国家</label>
                            <input type="text" id="address-country" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                    <div id="address-error" class="text-red-500 text-sm hidden"></div>
                    <div id="address-success" class="text-green-500 text-sm hidden"></div>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-md transition duration-150 ease-in-out">
                        <i class="fa fa-save mr-2"></i>保存地址
                    </button>
                </form>
            </div>

            <!-- Change Password Section -->
            <div id="password-section" class="mb-8">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">修改密码</h2>
                <form id="password-form" class="bg-gray-50 rounded-lg p-6 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">当前密码</label>
                        <input type="password" id="old-password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">新密码</label>
                        <input type="password" id="new-password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required minlength="6">
                        <p class="text-xs text-gray-500 mt-1">密码至少6个字符</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">确认新密码</label>
                        <input type="password" id="confirm-password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required minlength="6">
                    </div>
                    <div id="password-error" class="text-red-500 text-sm hidden"></div>
                    <div id="password-success" class="text-green-500 text-sm hidden"></div>
                    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-6 rounded-md transition duration-150 ease-in-out">
                        <i class="fa fa-key mr-2"></i>修改密码
                    </button>
                </form>
            </div>

            <!-- Sign Out Section -->
            <div class="border-t pt-6">
                <button id="signout-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-medium py-2 px-6 rounded-md transition duration-150 ease-in-out">
                    <i class="fa fa-sign-out-alt mr-2"></i>退出登录
                </button>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
