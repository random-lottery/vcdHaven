<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <nav class="bg-gray-800 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-white font-bold text-xl">VCDHaven</span>
                </div>
                <div class="hidden md:flex md:items-center md:space-x-4">
                    <a href="videopage.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out">
                        <i class="fa fa-play-circle mr-2"></i>播放视频
                    </a>
                    <a href="management.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out">
                        <i class="fa fa-th-list mr-2"></i>管理视频
                    </a>
                    <a href="add_videogroup.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out">
                        <i class="fa fa-plus-circle mr-2"></i>添加视频组
                    </a>
                    <a href="move_video.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out">
                        <i class="fa fa-arrows mr-2"></i>移动视频
                    </a>
                    <a href="storage_manager.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out">
                        <i class="fa fa-hdd mr-2"></i>存储管理
                    </a>
                    <a href="clock24.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out">
                        <i class="fa fa-clock-four mr-2"></i>全球时区时钟
                    </a>
                    <!-- User Authentication Section -->
                    <div id="user-auth-section" class="flex items-center space-x-2">
                        <span id="user-name" class="text-gray-300 text-sm hidden"></span>
                        <a href="dashboard.html" id="dashboard-link" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out hidden">
                            <i class="fa fa-user-circle mr-2"></i>仪表板
                        </a>
                    </div>
                </div>
                <div class="md:hidden flex items-center">
                    <button type="button" class="text-gray-300 hover:text-white focus:outline-none" id="mobile-menu-button">
                        <i class="fa fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    
        <div class="hidden md:hidden" id="mobile-menu">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="videopage.html" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">
                    <i class="fa fa-play-circle mr-2"></i>播放视频
                </a>
                <a href="management.html" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">
                    <i class="fa fa-th-list mr-2"></i>管理视频
                </a>
                <a href="add_videogroup.html" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">
                    <i class="fa fa-plus-circle mr-2"></i>添加视频组
                </a>
                <a href="move_video.html" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">
                    <i class="fa fa-arrows mr-2"></i>移动视频
                </a>
                <a href="storage_manager.html" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">
                    <i class="fa fa-hdd mr-2"></i>存储管理
                </a>
                <a href="clock24.html" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">
                    <i class="fa fa-clock-four mr-2"></i>全球时区时钟
                </a>
                <!-- Mobile User Authentication Section -->
                <div id="mobile-user-auth" class="border-t border-gray-700 pt-2 mt-2">
                    <a href="dashboard.html" id="mobile-dashboard-link" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium hidden">
                        <i class="fa fa-user-circle mr-2"></i>仪表板
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-lg p-8 mt-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Video Management</h1>
        
        <div class="mb-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Video List</h2>
            <div class="overflow-x-auto rounded-lg shadow">
                <table id="videoTable" class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Snapshot</th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">URL</th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Summary</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <!-- Rows will be dynamically added here -->
                    </tbody>
                </table>
            </div>
            <input type="hidden" id="selectedVideoId" />
        </div>

        <form id="videoForm" class="space-y-6">
            <div>
                <label for="url" class="block text-sm font-medium text-gray-700 mb-2">URL:</label>
                <input type="text" id="url" name="url" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-2">Title:</label>
                <input type="text" id="title" name="title" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <div>
                <label for="videoSummary" class="block text-sm font-medium text-gray-700 mb-2">Summary:</label>
                <textarea id="videoSummary" rows="4" cols="50" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
            </div>
            
            <div class="flex space-x-4">
                <button type="button" onclick="addVideo()" class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors">Add</button>
                <button type="button" onclick="modifyVideo()" class="px-6 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 transition-colors">Modify</button>
                <button type="button" onclick="deleteVideo()" class="px-6 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors">Delete</button>
                <button type="button" onclick="saveVideoDetails()" class="px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors">SaveSnapShot</button>
            </div>
        </form>

        <div class="mt-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Video Preview</h2>
            <video id="videoPreview" width="320" height="240" controls crossorigin="anonymous" class="border border-gray-300 rounded-lg"></video>
            <button onclick="previewVideo()" class="mt-4 px-6 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors">Preview</button>
        </div>

        <div class="mt-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Snapshot</h2>
            <canvas id="videoSnapshot" width="320" height="240" class="border border-gray-300 rounded-lg"></canvas>
            <button onclick="takeSnapshot()" class="mt-4 px-6 py-2 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600 transition-colors">Take Snapshot</button>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="management.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.auth?.isAuthenticated?.()) {
                populateVideoData();
            }
        });
    </script>
</body>
</html>
