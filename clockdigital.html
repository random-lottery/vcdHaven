
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24小时制数字时钟</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap');
        .orbitron-font { font-family: 'Orbitron', monospace; }
        .time-shadow { text-shadow: 0 0 15px rgba(0, 255, 255, 0.7); }
        .pulse-animation { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .flip-card { transition: transform 0.3s ease; }
        .flip-card:hover { transform: translateY(-5px); }
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 to-black min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-4xl">
        <!-- 主时钟区域 -->
        <div class="text-center mb-8 flip-card glass-effect rounded-2xl p-8 shadow-xl">
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-2 orbitron-font">24小时制数字时钟</h1>
            <div id="timeDisplay" class="text-6xl md:text-8xl font-bold text-cyan-300 my-6 orbitron-font time-shadow pulse-animation">
                00:00:00
            </div>
            <div id="dateDisplay" class="text-xl md:text-2xl text-white opacity-90 orbitron-font">
                2026年02月26日 星期四
            </div>
        </div>

        <!-- 功能控制区 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 闹钟设置 -->
            <div class="flip-card glass-effect rounded-2xl p-6 shadow-lg">
                <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
                    <i class="fas fa-bell mr-2 text-yellow-400"></i>闹钟设置
                </h2>
                <div class="space-y-4">
                    <div class="flex items-center space-x-3">
                        <input type="time" id="alarmTime" class="flex-1 bg-gray-800 text-white px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500">
                        <button id="setAlarmBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition duration-300">
                            设置
                        </button>
                    </div>
                    <div id="alarmStatus" class="text-sm text-gray-300 italic">
                        尚未设置闹钟
                    </div>
                </div>
            </div>

            <!-- 世界时钟 -->
            <div class="flip-card glass-effect rounded-2xl p-6 shadow-lg">
                <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
                    <i class="fas fa-globe-americas mr-2 text-blue-400"></i>世界时钟
                </h2>
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-300">纽约</span>
                        <span id="nyTime" class="text-white font-medium">--:--:--</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-300">伦敦</span>
                        <span id="londonTime" class="text-white font-medium">--:--:--</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-300">东京</span>
                        <span id="tokyoTime" class="text-white font-medium">--:--:--</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 设置面板 -->
        <div class="mt-6 flip-card glass-effect rounded-2xl p-6 shadow-lg">
            <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
                <i class="fas fa-cog mr-2 text-purple-400"></i>个性化设置
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-gray-300 mb-2">主题颜色</label>
                    <select id="colorTheme" class="w-full bg-gray-800 text-white px-3 py-2 rounded-lg focus:outline-none">
                        <option value="cyan">青色</option>
                        <option value="blue">蓝色</option>
                        <option value="green">绿色</option>
                        <option value="purple">紫色</option>
                        <option value="pink">粉色</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-300 mb-2">显示格式</label>
                    <select id="timeFormat" class="w-full bg-gray-800 text-white px-3 py-2 rounded-lg focus:outline-none">
                        <option value="24">24小时制</option>
                        <option value="12">12小时制</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button id="toggleSeconds" class="w-full bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg transition duration-300">
                        隐藏秒数
                    </button>
                </div>
            </div>
        </div>

        <!-- 底部信息 -->
        <div class="mt-8 text-center text-gray-500 text-sm">
            <p>© 2026 数字时钟 | 实时精确到秒 | 自动同步系统时间</p>
        </div>
    </div>

    <script>
        // 全局变量
        let alarmTime = null;
        let alarmActive = false;
        let showSeconds = true;
        let timeFormat = '24';
        let currentTheme = 'cyan';

        // DOM元素
        const timeDisplay = document.getElementById('timeDisplay');
        const dateDisplay = document.getElementById('dateDisplay');
        const alarmTimeInput = document.getElementById('alarmTime');
        const setAlarmBtn = document.getElementById('setAlarmBtn');
        const alarmStatus = document.getElementById('alarmStatus');
        const colorThemeSelect = document.getElementById('colorTheme');
        const timeFormatSelect = document.getElementById('timeFormat');
        const toggleSecondsBtn = document.getElementById('toggleSeconds');

        // 初始化
        function init() {
            updateDateTime();
            setInterval(updateDateTime, 1000);
            setupEventListeners();
        }

        // 更新时间和日期
        function updateDateTime() {
            const now = new Date();
            
            // 更新本地时间
            updateTimeDisplay(now);
            
            // 更新日期显示
            updateDateDisplay(now);
            
            // 更新世界时钟
            updateWorldClocks(now);
            
            // 检查闹钟
            checkAlarm(now);
        }

        // 更新时间显示
        function updateTimeDisplay(date) {
            let hours = date.getHours();
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            
            // 时间格式转换
            if (timeFormat === '12') {
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12 || 12;
                const formattedHours = String(hours).padStart(2, '0');
                timeDisplay.textContent = showSeconds 
                    ? `${formattedHours}:${minutes}:${seconds} ${ampm}` 
                    : `${formattedHours}:${minutes} ${ampm}`;
            } else {
                const formattedHours = String(hours).padStart(2, '0');
                timeDisplay.textContent = showSeconds 
                    ? `${formattedHours}:${minutes}:${seconds}` 
                    : `${formattedHours}:${minutes}`;
            }
        }

        // 更新日期显示
        function updateDateDisplay(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekday = weekdays[date.getDay()];
            
            dateDisplay.textContent = `${year}年${month}月${day}日 ${weekday}`;
        }

        // 更新世界时钟
        function updateWorldClocks(date) {
            // 纽约时间 (UTC-5)
            const nyDate = new Date(date.getTime() - (5 * 60 * 60 * 1000));
            document.getElementById('nyTime').textContent = formatWorldTime(nyDate);
            
            // 伦敦时间 (UTC+0)
            const londonDate = new Date(date.getTime());
            document.getElementById('londonTime').textContent = formatWorldTime(londonDate);
            
            // 东京时间 (UTC+9)
            const tokyoDate = new Date(date.getTime() + (9 * 60 * 60 * 1000));
            document.getElementById('tokyoTime').textContent = formatWorldTime(tokyoDate);
        }

        // 格式化世界时钟时间
        function formatWorldTime(date) {
            const hours = String(date.getUTCHours()).padStart(2, '0');
            const minutes = String(date.getUTCMinutes()).padStart(2, '0');
            const seconds = String(date.getUTCSeconds()).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        // 检查闹钟
        function checkAlarm(date) {
            if (!alarmTime || alarmActive) return;
            
            const currentTime = `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
            
            if (currentTime === alarmTime) {
                activateAlarm();
            }
        }

        // 激活闹钟
        function activateAlarm() {
            alarmActive = true;
            timeDisplay.classList.add('animate-pulse', 'text-red-500');
            
            // 创建通知
            alarmStatus.innerHTML = `
                <div class="flex items-center text-red-400">
                    <i class="fas fa-exclamation-circle mr-2 animate-bounce"></i>
                    闹钟响铃中！
                </div>
            `;
            
            setTimeout(async () => {
                let notAlarm = true;
                // 播放声音提醒（模拟）
                if(notAlarm){
                  alert("⏰ 闹钟响了！");
                  await playAlarmSound();
                }
                notAlarm = false;
            }, 10);

            
            // 5秒后自动停止
            setTimeout(() => {
                stopAlarm();
            }, 5000);
        }

        const playAlarmSound = async () => {
          return new Promise((resolve, reject) => {
            if (!alarmSoundPath) {
              console.error('Alarm sound path is not defined.');
              reject(new Error('Alarm sound path not set.'));
              return;
            }
        
            // 如果 audioPlayer 还没有实例，或者之前的音频播放器已经结束
            if (!audioPlayer.value || audioPlayer.value.ended) {
              audioPlayer.value = new Audio(alarmSoundPath);
              audioPlayer.value.loop = false; // 默认不循环
            }
        
            // 播放音频
            audioPlayer.value.play()
              .then(() => {
                console.log('Alarm sound started playing.');
                // 监听播放结束事件
                audioPlayer.value?.addEventListener('ended', () => {
                  console.log('Alarm sound finished playing.');
                  resolve();
                }, { once: true }); // 确保事件监听器只触发一次
              })
              .catch((error) => {
                // 捕获播放错误，例如用户没有交互（浏览器安全策略）
                console.error('Failed to play alarm sound:', error);
                // 如果是用户交互导致的错误，可以尝试其他提醒方式
                if (error.name === 'NotAllowedError' || error.name === 'NotSupportedError') {
                  alert("⏰ 闹钟响了！(由于浏览器限制，声音可能无法自动播放)");
                }
                reject(error); // 拒绝 Promise
              });
          });
        };
        
        // 停止闹钟
        function stopAlarm() {
            alarmActive = false;
            timeDisplay.classList.remove('animate-pulse', 'text-red-500');
            alarmStatus.textContent = "闹钟已关闭";
            if (audioPlayer.value && !audioPlayer.value.paused) {
              audioPlayer.value.pause();
              audioPlayer.value.currentTime = 0; // 重置到开始
              console.log('Alarm sound stopped.');
            }
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 设置闹钟
            setAlarmBtn.addEventListener('click', () => {
                alarmTime = alarmTimeInput.value;
                if (alarmTime) {
                    alarmStatus.innerHTML = `
                        <div class="flex items-center text-green-400">
                            <i class="fas fa-check-circle mr-2"></i>
                            闹钟已设置为 ${alarmTime}
                        </div>
                    `;
                } else {
                    alarmStatus.innerHTML = '<div class="text-yellow-400">请选择有效时间</div>';
                }
            });
            
            // 切换主题颜色
            colorThemeSelect.addEventListener('change', (e) => {
                currentTheme = e.target.value;
                applyColorTheme(currentTheme);
            });
            
            // 切换时间格式
            timeFormatSelect.addEventListener('change', (e) => {
                timeFormat = e.target.value;
                updateDateTime();
            });
            
            // 切换秒数显示
            toggleSecondsBtn.addEventListener('click', () => {
                showSeconds = !showSeconds;
                toggleSecondsBtn.textContent = showSeconds ? '隐藏秒数' : '显示秒数';
                updateDateTime();
            });
        }

        // 应用颜色主题
        function applyColorTheme(theme) {
            const themeColors = {
                cyan: 'text-cyan-300',
                blue: 'text-blue-400',
                green: 'text-green-400',
                purple: 'text-purple-400',
                pink: 'text-pink-400'
            };
            
            // 移除旧主题类
            Object.values(themeColors).forEach(color => {
                timeDisplay.classList.remove(color);
            });
            
            // 应用新主题
            timeDisplay.classList.add(themeColors[theme]);
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
