<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCDHaven</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="index.css", rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <nav class="bg-gray-800 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-white font-bold text-xl">VCDHaven</span>
                </div>
                <div class="hidden md:flex md:items-center md:space-x-4">
                    <a href="videopage.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out">
                        <i class="fa fa-play-circle mr-2"></i>播放视频
                    </a>
                    <a href="management.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out">
                        <i class="fa fa-th-list mr-2"></i>管理视频
                    </a>
                    <a href="add_videogroup.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out">
                        <i class="fa fa-plus-circle mr-2"></i>添加视频组
                    </a>
                    <a href="move_video.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out">
                        <i class="fa fa-arrows mr-2"></i>移动视频
                    </a>
                    <a href="storage_manager.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out">
                        <i class="fa fa-hdd mr-2"></i>存储管理
                    </a>
                    <a href="clock24.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out">
                        <i class="fa fa-clock-four mr-2"></i>全球时区时钟
                    </a>
                    <!-- User Authentication Section -->
                    <div id="user-auth-section" class="flex items-center space-x-2">
                        <span id="user-name" class="text-gray-300 text-sm hidden"></span>
                        <a href="dashboard.html" id="dashboard-link" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out hidden">
                            <i class="fa fa-user-circle mr-2"></i>仪表板
                        </a>
                        <button id="signin-btn" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out">
                            <i class="fa fa-sign-in-alt mr-2"></i>登录
                        </button>
                        <button id="signup-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out">
                            <i class="fa fa-user-plus mr-2"></i>注册
                        </button>
                        <button id="signout-btn" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out hidden">
                            <i class="fa fa-sign-out-alt mr-2"></i>退出
                        </button>
                    </div>
                </div>
                <div class="md:hidden flex items-center">
                    <button type="button" class="text-gray-300 hover:text-white focus:outline-none" id="mobile-menu-button">
                        <i class="fa fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    
        <div class="hidden md:hidden" id="mobile-menu">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="videopage.html" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">
                    <i class="fa fa-play-circle mr-2"></i>播放视频
                </a>
                <a href="management.html" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">
                    <i class="fa fa-th-list mr-2"></i>管理视频
                </a>
                <a href="add_videogroup.html" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">
                    <i class="fa fa-plus-circle mr-2"></i>添加视频组
                </a>
                <a href="move_video.html" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">
                    <i class="fa fa-arrows mr-2"></i>移动视频
                </a>
                <a href="storage_manager.html" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">
                    <i class="fa fa-hdd mr-2"></i>存储管理
                </a>
                <a href="clock24.html" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">
                    <i class="fa fa-clock-four mr-2"></i>全球时区时钟
                </a>
                <!-- Mobile User Authentication Section -->
                <div id="mobile-user-auth" class="border-t border-gray-700 pt-2 mt-2">
                    <a href="dashboard.html" id="mobile-dashboard-link" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium hidden">
                        <i class="fa fa-user-circle mr-2"></i>仪表板
                    </a>
                    <button id="mobile-signin-btn" class="text-gray-300 hover:text-white block w-full text-left px-3 py-2 rounded-md text-base font-medium">
                        <i class="fa fa-sign-in-alt mr-2"></i>登录
                    </button>
                    <button id="mobile-signup-btn" class="text-gray-300 hover:text-white block w-full text-left px-3 py-2 rounded-md text-base font-medium">
                        <i class="fa fa-user-plus mr-2"></i>注册
                    </button>
                    <button id="mobile-signout-btn" class="text-gray-300 hover:text-white block w-full text-left px-3 py-2 rounded-md text-base font-medium hidden">
                        <i class="fa fa-sign-out-alt mr-2"></i>退出
                    </button>
                </div>
            </div>
        </div>
    </nav>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
        <div class="bg-darkred rounded-lg shadow-md overflow-hidden">
            <div class="dplayer-container">
                <iframe 
                  src="dplayer.html?url=https://v3.tlkqc.com/wjv3/202501/14/jscdKUjChr75/video/index.m3u8&cover=https://p0.ssl.qhimgs1.com/sdr/400__/t04c5e2979b9a979d94.jpg" 
                  width="100%" 
                  height="500px" 
                  frameborder="0" 
                  allow="autoplay; encrypted-media"
                  allowfullscreen 
                ></iframe>
            </div>
        </div>
        <div class="bg-darkred rounded-lg shadow-md overflow-hidden">
            <div class="carousel-container">
                <ul class="carousel">
                    <li style="background-image: url('https://img999.51weizhang.cn/upload/vod/20250301-1/b801805b5c11fc204d6e4effdc4fbadd.jpg')"></li>
                    <li style="background-image: url('https://nimg.ws.126.net/?url=http%3A%2F%2Fdingyue.ws.126.net%2F2024%2F0312%2Fdddc144fj00sa7anu0021d000hs00srp.jpg')"></li> 
                    <li style="background-image: url('https://p0.ssl.qhimgs1.com/sdr/400__/t04c5e2979b9a979d94.jpg')"></li> 
                </ul>
                
                <button class="carousel-btn prev"><</button>
                <button class="carousel-btn next">></button>
                
                <div class="indicator"></div>
            </div>
        </div>
    </div>
        
     <!-- 在原有轮播容器下方添加 -->
    <div class="bg-gray-800 p-4 flex justify-center space-x-4">
        <div class="thumbnail-container">
            <div class="thumbnails">
                <div class="thumb-item active" data-index="0">
                    <img src="video-thumb1.jpg"  alt="视频1">
                </div>
                <div class="thumb-item" data-index="1">
                    <img src="video-thumb2.jpg"  alt="视频2">
                </div>
                <div class="thumb-item" data-index="2">
                    <img src="video-thumb3.jpg"  alt="视频3">
                </div>
            </div>
        </div>
    </div>

    <!-- Sign In Modal -->
    <div id="signin-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold text-gray-800">登录</h2>
                    <button id="close-signin" class="text-gray-500 hover:text-gray-700">
                        <i class="fa fa-times text-xl"></i>
                    </button>
                </div>
                <form id="signin-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">用户名或邮箱</label>
                        <input type="text" id="signin-username" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                        <input type="password" id="signin-password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div id="signin-error" class="text-red-500 text-sm hidden"></div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition duration-150 ease-in-out">
                        登录
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Sign Up Modal -->
    <div id="signup-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold text-gray-800">注册</h2>
                    <button id="close-signup" class="text-gray-500 hover:text-gray-700">
                        <i class="fa fa-times text-xl"></i>
                    </button>
                </div>
                <form id="signup-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                        <input type="text" id="signup-username" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
                        <input type="email" id="signup-email" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                        <input type="password" id="signup-password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required minlength="6">
                        <p class="text-xs text-gray-500 mt-1">密码至少6个字符</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">手机号 (可选)</label>
                        <input type="tel" id="signup-phone" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div id="signup-error" class="text-red-500 text-sm hidden"></div>
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-md transition duration-150 ease-in-out">
                        注册
                    </button>
                </form>
            </div>
        </div>
    </div>

<script src="auth.js"></script>
<script src="index.js"></script>
</body>
</html>
